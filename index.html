<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>College Selection</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🎓 College Selection</h1>
      <p>Find your perfect college match</p>
    </header>
    
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search colleges...">
      <button onclick="searchColleges()">Search</button>
    </div>
    
    <div class="filters">
      <select id="stdFilter">
        <option value="">Select Standard</option>
        <option value="11">11th</option>
        <option value="12">12th</option>
        <option value="bachelors">Bachelors</option>
        <option value="masters">Masters</option>
        <option value="phd">PhD</option>
      </select>
      
      <select id="ratingFilter">
        <option value="">All Ratings</option>
        <option value="4.5">4.5+ Stars</option>
        <option value="4">4+ Stars</option>
        <option value="3.5">3.5+ Stars</option>
        <option value="3">3+ Stars</option>
      </select>

      <select id="streamFilter">
        <option value="">All Streams</option>
        <option value="Science">Science</option>
        <option value="Commerce">Commerce</option>
        <option value="Arts">Arts</option>
      </select>
    </div>
    
    <div class="colleges-grid" id="collegesGrid">
      <!-- College cards will be generated here -->
    </div>
  </div>
  
  <script>
    const colleges = [
      { id: 1, name: "Mithibai College", rating: 4.9, location: "Vile Parle", emoji: "🎓", stream: "Science, Commerce, Arts" },
      { id: 2, name: "Jai Hind College", rating: 4.8, location: "Churchgate", emoji: "📖", stream: "Arts, Commerce" },
      { id: 3, name: "Narsee Monjee College", rating: 4.9, location: "Vile Parle", emoji: "💼", stream: "Commerce" },
      { id: 4, name: "HR College", rating: 4.8, location: "Churchgate", emoji: "💼", stream: "Commerce" },
      { id: 5, name: "D.G. Ruparel College", rating: 4.7, location: "Matunga", emoji: "🔬", stream: "Science" },
      { id: 6, name: "Ramnarain Ruia College", rating: 4.6, location: "Matunga", emoji: "📖", stream: "Arts" },
      { id: 7, name: "K.J. Somaiya College", rating: 4.7, location: "Vidyavihar", emoji: "🎓", stream: "Science, Commerce" },
      { id: 8, name: "St. Xavier's College", rating: 4.9, location: "Fort", emoji: "📖", stream: "Arts, Commerce" },
      { id: 9, name: "Durgadevi Saraf College", rating: 4.5, location: "Malad", emoji: "🎓", stream: "Commerce, Science" }
    ];
    
    function renderColleges(data) {
      const grid = document.getElementById('collegesGrid');
      grid.innerHTML = data.map(college => `
        <div class="college-card">
          <div class="college-image">${college.emoji}</div>
          <div class="college-info">
            <h3>${college.name}</h3>
            <p><strong>Location:</strong> ${college.location}</p>
            <p><strong>Stream:</strong> ${college.stream}</p>
            <div class="rating">⭐ ${college.rating}</div>
            <div class="btn-group">
              <button class="btn btn-primary">Learn More</button>
              <button class="btn btn-secondary">Save</button>
            </div>
          </div>
        </div>
      `).join('');
    }
    
    function searchColleges() {
      const search = document.getElementById('searchInput').value.toLowerCase();
      const rating = parseFloat(document.getElementById('ratingFilter').value) || 0;
      const stream = document.getElementById('streamFilter').value;

      const filtered = colleges.filter(c => 
        c.name.toLowerCase().includes(search) &&
        c.rating >= rating &&
        (stream === "" || c.stream.includes(stream))
      );

      renderColleges(filtered);
    }
    
    renderColleges(colleges);
  </script>
</body>
</html>
